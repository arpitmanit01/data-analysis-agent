[project]
name = "data-analysis-agent"
version = "0.1.0"
description = "Agentic Data Analysis assistant: profiles a CSV, asks clarifying questions, generates and executes analysis code, and returns insights."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "pandas>=2.2.0",
    "matplotlib>=3.9.0",
    "tabulate>=0.9.0",
    "pydantic>=2.8.0",
    "python-dotenv>=1.0.1",
    "tenacity>=9.0.0",
    "tiktoken>=0.8.0",
    "streamlit>=1.38.0",
]

[project.scripts]
data-analysis-agent = "data_analysis_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_analysis_agent"]
